<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Verdana, Geneva, sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<text x="36" y="34" font-size="19" font-weight="bold" fill="#24292e">World trade stopped growing faster than the world economy</text>
<text x="36" y="56" font-size="12.5" fill="#57606a">World trade as a share of world GDP, percent. This flat line is what the 2019 Slowbalisation cover named.</text>
<line x1="70" y1="322" x2="690" y2="322" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="326" font-size="11" fill="#57606a" text-anchor="end">0</text>
<line x1="70" y1="262" x2="690" y2="262" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="266" font-size="11" fill="#57606a" text-anchor="end">18</text>
<line x1="70" y1="203" x2="690" y2="203" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="207" font-size="11" fill="#57606a" text-anchor="end">35</text>
<line x1="70" y1="144" x2="690" y2="144" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="148" font-size="11" fill="#57606a" text-anchor="end">52</text>
<line x1="70" y1="84" x2="690" y2="84" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="88" font-size="11" fill="#57606a" text-anchor="end">70</text>
<text x="18" y="203" font-size="11.5" fill="#57606a" transform="rotate(-90 18 203)" text-anchor="middle">Percent of world GDP</text>
<polyline points="70,115 277,118 483,125 690,125" fill="none" stroke="#e3120b" stroke-width="3"/>
<circle cx="70" cy="115" r="4.5" fill="#e3120b"/>
<text x="70" y="103" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">61</text>
<text x="70" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2008</text>
<circle cx="277" cy="118" r="4.5" fill="#e3120b"/>
<text x="277" y="106" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">60</text>
<text x="277" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2011</text>
<circle cx="483" cy="125" r="4.5" fill="#e3120b"/>
<text x="483" y="113" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">58</text>
<text x="483" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2015</text>
<circle cx="690" cy="125" r="4.5" fill="#e3120b"/>
<text x="690" y="113" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">58</text>
<text x="690" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2019</text>
<text x="36" y="368" font-size="11" fill="#57606a">Approximate, World Bank data. The golden age of fast globalisation ended after 2008.</text></svg>