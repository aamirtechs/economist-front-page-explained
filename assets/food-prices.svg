<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Verdana, Geneva, sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<text x="36" y="34" font-size="19" font-weight="bold" fill="#24292e">World food prices: the 2022 spike and the fall</text>
<text x="36" y="56" font-size="12.5" fill="#57606a">FAO world food price index. War in Ukraine pushed prices to a record, then the grain deal helped bring them down.</text>
<line x1="70" y1="322" x2="690" y2="322" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="326" font-size="11" fill="#57606a" text-anchor="end">0</text>
<line x1="70" y1="262" x2="690" y2="262" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="266" font-size="11" fill="#57606a" text-anchor="end">45</text>
<line x1="70" y1="203" x2="690" y2="203" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="207" font-size="11" fill="#57606a" text-anchor="end">90</text>
<line x1="70" y1="144" x2="690" y2="144" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="148" font-size="11" fill="#57606a" text-anchor="end">135</text>
<line x1="70" y1="84" x2="690" y2="84" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="88" font-size="11" fill="#57606a" text-anchor="end">180</text>
<text x="18" y="203" font-size="11.5" fill="#57606a" transform="rotate(-90 18 203)" text-anchor="middle">Index</text>
<polyline points="70,144 225,110 380,137 535,147 690,161" fill="none" stroke="#e3120b" stroke-width="3"/>
<circle cx="70" cy="144" r="4.5" fill="#e3120b"/>
<text x="70" y="132" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">135</text>
<text x="70" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Jan 2022</text>
<circle cx="225" cy="110" r="4.5" fill="#e3120b"/>
<text x="225" y="98" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">160</text>
<text x="225" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Mar 2022 peak</text>
<circle cx="380" cy="137" r="4.5" fill="#e3120b"/>
<text x="380" y="125" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">140</text>
<text x="380" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Jul 2022</text>
<circle cx="535" cy="147" r="4.5" fill="#e3120b"/>
<text x="535" y="135" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">132</text>
<text x="535" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Dec 2022</text>
<circle cx="690" cy="161" r="4.5" fill="#e3120b"/>
<text x="690" y="149" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">122</text>
<text x="690" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Jun 2023</text>
<text x="36" y="368" font-size="11" fill="#57606a">Approximate monthly values, FAO food price index.</text></svg>