<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Verdana, Geneva, sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<text x="36" y="34" font-size="19" font-weight="bold" fill="#24292e">The oil price crash of 2014 to 2016</text>
<text x="36" y="56" font-size="12.5" fill="#57606a">Brent oil price, dollars per barrel. The sheikhs and the shale drillers fought, and the price broke.</text>
<line x1="70" y1="322" x2="690" y2="322" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="326" font-size="11" fill="#57606a" text-anchor="end">0</text>
<line x1="70" y1="262" x2="690" y2="262" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="266" font-size="11" fill="#57606a" text-anchor="end">32</text>
<line x1="70" y1="203" x2="690" y2="203" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="207" font-size="11" fill="#57606a" text-anchor="end">65</text>
<line x1="70" y1="144" x2="690" y2="144" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="148" font-size="11" fill="#57606a" text-anchor="end">98</text>
<line x1="70" y1="84" x2="690" y2="84" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="88" font-size="11" fill="#57606a" text-anchor="end">130</text>
<text x="18" y="203" font-size="11.5" fill="#57606a" transform="rotate(-90 18 203)" text-anchor="middle">Dollars per barrel</text>
<polyline points="70,111 225,212 380,207 535,265 690,221" fill="none" stroke="#e3120b" stroke-width="3"/>
<circle cx="70" cy="111" r="4.5" fill="#e3120b"/>
<text x="70" y="99" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">115</text>
<text x="70" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Jun 2014</text>
<circle cx="225" cy="212" r="4.5" fill="#e3120b"/>
<text x="225" y="200" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">60</text>
<text x="225" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Dec 2014</text>
<circle cx="380" cy="207" r="4.5" fill="#e3120b"/>
<text x="380" y="195" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">63</text>
<text x="380" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Jun 2015</text>
<circle cx="535" cy="265" r="4.5" fill="#e3120b"/>
<text x="535" y="253" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">31</text>
<text x="535" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Jan 2016</text>
<circle cx="690" cy="221" r="4.5" fill="#e3120b"/>
<text x="690" y="209" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">55</text>
<text x="690" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">Dec 2016</text>
<text x="36" y="368" font-size="11" fill="#57606a">Approximate monthly prices. Oil fell below 30 dollars a barrel at the worst point in early 2016.</text></svg>