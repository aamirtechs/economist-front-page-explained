<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Verdana, Geneva, sans-serif">
<rect width="720" height="300" fill="#ffffff"/>
<text x="36" y="34" font-size="19" font-weight="bold" fill="#24292e">COVID-19: from first warning to vaccines</text>
<text x="36" y="56" font-size="12.5" fill="#57606a">The February 2020 cover asked how bad it would get. This is what happened next.</text>
<line x1="50" y1="150" x2="690" y2="150" stroke="#24292e" stroke-width="3"/>
<circle cx="50" cy="150" r="7" fill="#e3120b"/>
<text x="50" y="92" font-size="12.5" font-weight="bold" fill="#24292e" text-anchor="middle">Jan 2020</text>
<text x="50" y="110" font-size="11" fill="#57606a" text-anchor="middle">New virus spreads</text>
<text x="50" y="125" font-size="11" fill="#57606a" text-anchor="middle">from Wuhan, China</text>
<circle cx="210" cy="150" r="7" fill="#e3120b"/>
<text x="210" y="222" font-size="12.5" font-weight="bold" fill="#24292e" text-anchor="middle">Feb 2020</text>
<text x="210" y="240" font-size="11" fill="#57606a" text-anchor="middle">The Economist</text>
<text x="210" y="255" font-size="11" fill="#57606a" text-anchor="middle">asks: how bad will</text>
<text x="210" y="270" font-size="11" fill="#57606a" text-anchor="middle">it get?</text>
<circle cx="370" cy="150" r="7" fill="#e3120b"/>
<text x="370" y="92" font-size="12.5" font-weight="bold" fill="#24292e" text-anchor="middle">Mar 2020</text>
<text x="370" y="110" font-size="11" fill="#57606a" text-anchor="middle">WHO declares a</text>
<text x="370" y="125" font-size="11" fill="#57606a" text-anchor="middle">pandemic,</text>
<text x="370" y="140" font-size="11" fill="#57606a" text-anchor="middle">lockdowns begin</text>
<circle cx="530" cy="150" r="7" fill="#e3120b"/>
<text x="530" y="222" font-size="12.5" font-weight="bold" fill="#24292e" text-anchor="middle">Dec 2020</text>
<text x="530" y="240" font-size="11" fill="#57606a" text-anchor="middle">First vaccines</text>
<text x="530" y="255" font-size="11" fill="#57606a" text-anchor="middle">approved and given</text>
<circle cx="690" cy="150" r="7" fill="#e3120b"/>
<text x="690" y="92" font-size="12.5" font-weight="bold" fill="#24292e" text-anchor="middle">2021</text>
<text x="690" y="110" font-size="11" fill="#57606a" text-anchor="middle">Delta and Omicron</text>
<text x="690" y="125" font-size="11" fill="#57606a" text-anchor="middle">waves circle the</text>
<text x="690" y="140" font-size="11" fill="#57606a" text-anchor="middle">world</text>
<text x="36" y="282" font-size="11" fill="#57606a">The pandemic killed millions and changed daily life for years.</text></svg>