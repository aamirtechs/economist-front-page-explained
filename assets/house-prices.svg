<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Verdana, Geneva, sans-serif">
<rect width="720" height="380" fill="#ffffff"/>
<text x="36" y="34" font-size="19" font-weight="bold" fill="#24292e">US house prices: the bubble and the fall</text>
<text x="36" y="56" font-size="12.5" fill="#57606a">Index of US house prices, 2000 = 100. The 2005 cover warned when prices were near the top.</text>
<line x1="70" y1="322" x2="690" y2="322" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="326" font-size="11" fill="#57606a" text-anchor="end">0</text>
<line x1="70" y1="262" x2="690" y2="262" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="266" font-size="11" fill="#57606a" text-anchor="end">50</text>
<line x1="70" y1="203" x2="690" y2="203" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="207" font-size="11" fill="#57606a" text-anchor="end">100</text>
<line x1="70" y1="144" x2="690" y2="144" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="148" font-size="11" fill="#57606a" text-anchor="end">150</text>
<line x1="70" y1="84" x2="690" y2="84" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="88" font-size="11" fill="#57606a" text-anchor="end">200</text>
<text x="18" y="203" font-size="11.5" fill="#57606a" transform="rotate(-90 18 203)" text-anchor="middle">Price index</text>
<polyline points="70,203 194,155 318,102 442,155 566,163 690,132" fill="none" stroke="#e3120b" stroke-width="3"/>
<circle cx="70" cy="203" r="4.5" fill="#e3120b"/>
<text x="70" y="191" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">100</text>
<text x="70" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2000</text>
<circle cx="194" cy="155" r="4.5" fill="#e3120b"/>
<text x="194" y="143" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">140</text>
<text x="194" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2003</text>
<circle cx="318" cy="102" r="4.5" fill="#e3120b"/>
<text x="318" y="90" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">185</text>
<text x="318" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2006 peak</text>
<circle cx="442" cy="155" r="4.5" fill="#e3120b"/>
<text x="442" y="143" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">140</text>
<text x="442" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2009</text>
<circle cx="566" cy="163" r="4.5" fill="#e3120b"/>
<text x="566" y="151" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">134</text>
<text x="566" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2012 low</text>
<circle cx="690" cy="132" r="4.5" fill="#e3120b"/>
<text x="690" y="120" font-size="12" font-weight="bold" fill="#24292e" text-anchor="middle">160</text>
<text x="690" y="344" font-size="11.5" fill="#24292e" text-anchor="middle">2015</text>
<text x="36" y="368" font-size="11" fill="#57606a">Approximate, based on the Case-Shiller national index. Prices fell by about a third from peak to low.</text></svg>